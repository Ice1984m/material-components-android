name: Build Catalog APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build catalog APK
        run: ./gradlew :catalog:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: catalog-debug-apk
          path: catalog/build/outputs/apk/debug/catalog-debug.apk
